[tools]
d2 = "0.9.0"
node = "26"
pnpm = "12.16.1"

[settings]
lockfile = true

[env]
ASTRO_TELEMETRY_DISABLED = "1"

[tasks.install]
description = "Install the website's packages from pnpm-lock.yaml"
run = "pnpm install --frozen-lockfile"

[tasks.diagrams]
description = "Render every diagram into public/diagrams/, where the website serves it"
run = '''
set -eu
rm -rf public/diagrams
find diagrams -name '*.d2' ! -name '_*' | while read -r f; do  # _*: imports, not diagrams
  d2 "$f" "public/${f%.d2}.svg"
done
'''

[tasks.dev]
description = "Preview the website at http://localhost:4321 (it reloads as you edit a page)"
depends = ["install", "diagrams"]
run = "pnpm run dev"

[tasks.build]
description = "Build the website into dist/, and fail on any broken internal link"
depends = ["install", "diagrams"]
run = "pnpm run build"

[tasks.watch]
description = "Live preview of one diagram in the browser"
usage = 'arg "<file>" help="the .d2 file"'
run = 'd2 --watch "${usage_file?}"'

[tasks.fmt]
description = "Format every .d2, Markdown and config file"
depends = ["install"]
run = '''
find diagrams -name '*.d2' -print0 | xargs -0 -r d2 fmt
pnpm exec prettier --write .
'''

[tasks.check]
description = "Fail if a .d2, Markdown or config file is unformatted"
depends = ["install"]
run = '''
find diagrams -name '*.d2' -print0 | xargs -0 -r d2 fmt --check
pnpm exec prettier --check .
'''
