name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Each page's "last updated" date comes from its git history.
          fetch-depth: 0

      - uses: jdx/mise-action@v5

      - name: Formatting
        run: mise run check

      - name: Build the website, failing on any broken link
        run: mise run build
